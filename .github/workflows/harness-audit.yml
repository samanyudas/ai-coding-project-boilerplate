name: harness-audit

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  issues: write

jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - name: Open this month's audit issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          title="Harness audit $(date -u +%Y-%m)"
          if gh issue list --state open --json title --jq '.[].title' | grep -qxF "$title"; then
            echo "Already open: $title"
            exit 0
          fi
          gh issue create --title "$title" --body "Run the checklist in \`docs/harness-audit.md\`, record the result in its Audit log, and close this issue."
